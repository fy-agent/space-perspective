            - $ref: "#/components/schemas/AnalysisBudgetV1"
          nullable: true

    AnalysisPacketV1:
      type: object
      additionalProperties: false
      required:
        - packet_id
        - packet_sha256
        - snapshot_id
        - snapshot_sha256
        - generated_at
        - artifact_privacy_mode
        - analysis_execution_mode
        - platform
        - canonical_tree_logical_size_bytes
        - coverage_summary
        - limitations
        - top_objects
        - long_tail
        - truncated
      properties:
        schema_version:
          type: string
          enum: ["1.0"]
          default: "1.0"
        packet_id:
          type: string
        packet_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        snapshot_id:
          type: string
        snapshot_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        generated_at:
          type: string
          format: date-time
        artifact_privacy_mode:
          type: string
          enum: [local_full, share_safe]
        analysis_execution_mode:
          type: string
          enum: [none, local_only, cloud_metadata_minimized]
        profile:
          type: string
          enum: [inventory_metadata]
          default: inventory_metadata
        platform:
          type: string
        content_read:
          type: boolean
          enum: [false]
          default: false
        hash_mode:
          type: string
          enum: [none]
          default: none
        canonical_tree_logical_size_bytes:
          type: integer
          minimum: 0
        canonical_tree_allocated_size_bytes:
          type: integer
          minimum: 0
          nullable: true
        reclaimable_estimate_bytes:
          type: integer
          minimum: 0
          nullable: true
        coverage_summary:
          $ref: "#/components/schemas/CoverageSummaryV1"
        limitations:
          type: array
          items:
            type: string
        top_objects:
          type: array
          items:
            $ref: "#/components/schemas/PacketObjectV1"
        long_tail:
          $ref: "#/components/schemas/LongTailV1"
        truncated:
          type: boolean

    CoverageSummaryV1:
      type: object
      additionalProperties: false
      required:
        - requested_entries
        - collected_entries
        - skipped_entries
        - permission_gap_count
        - cancelled
      properties:
        requested_entries:
          type: integer
          minimum: 0
        collected_entries:
          type: integer
          minimum: 0
        skipped_entries:
          type: integer
          minimum: 0
        permission_gap_count:
          type: integer
          minimum: 0
        cancelled:
          type: boolean

    PacketObjectV1:
      type: object
      additionalProperties: false
      required:
        - object_id
        - evidence_ids
        - object_type
        - display_name
        - location
        - name_length
        - logical_size_bytes
        - rule_hints
      properties:
        object_id:
          type: string
        evidence_ids:
          type: array
          minItems: 1
          items:
            type: string
        object_type:
          type: string
        display_name:
          type: string
        location:
          type: string
          nullable: true
        name_length:
          type: integer
          minimum: 0
        logical_size_bytes:
          type: integer
          minimum: 0
        allocated_size_bytes:
          type: integer
          minimum: 0
          nullable: true
        reclaimable_estimate_bytes:
          type: integer
          minimum: 0
          nullable: true
        rule_hints:
          type: array
          items:
            type: string

    LongTailV1:
      type: object
      additionalProperties: false
      required: [object_count, logical_size_bytes]
      properties:
        object_count:
          type: integer
          minimum: 0
        logical_size_bytes:
          type: integer
          minimum: 0

    PrivacyLintResult:
      type: object
      additionalProperties: false
      required: [passed, issue_codes, packet_bytes, max_packet_bytes]
      properties:
        passed:
          type: boolean
        issue_codes:
          type: array
          items:
            type: string
        packet_bytes:
          type: integer
          minimum: 0
        max_packet_bytes:
          type: integer
          minimum: 1

    InventoryPacketPreviewResponse:
      type: object
      additionalProperties: false
      required: [packet, privacy_lint, estimated_input_tokens]
      properties:
        packet:
          $ref: "#/components/schemas/AnalysisPacketV1"
        privacy_lint:
          allOf:
            - $ref: "#/components/schemas/PrivacyLintResult"
          nullable: true
        estimated_input_tokens:
          type: integer
          minimum: 1
        analysis_offer:
          allOf:
            - $ref: "#/components/schemas/AnalysisOfferV1"
          nullable: true

    InventoryAnalysisCreateRequest:
      type: object
      additionalProperties: false
      required: [packet_id, provider]
      properties:
        packet_id:
          type: string
        provider:
          type: string
          enum: [none, fake]
        consent:
          allOf:
            - $ref: "#/components/schemas/AnalysisConsentV1"
          nullable: true

    AIAnalysisV1:
      type: object
      required:
        - schema_version
        - analysis_id
        - packet_id
        - status
        - provider
        - model
        - summary
        - findings
        - questions
        - limitations
      properties:
        schema_version:
          type: string
          enum: ["1.0"]
        analysis_id:
          type: string
        packet_id:
          type: string
        status:
          type: string
          enum: [deterministic_only, ai_complete, ai_failed_fallback]
        provider:
          type: string
          enum: [none, fake]
        model:
          type: string
        summary:
          type: string
        findings:
          type: array
          items:
            type: object
        questions:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
      additionalProperties: false

    ModelCallReceiptV1:
      type: object
      required:
        - receipt_id
        - packet_sha256
        - provider
        - model
        - prompt_version
        - schema_version
        - cache_key
        - status
        - provider_calls
        - network_calls
        - input_tokens
        - cached_input_tokens
        - output_tokens
        - estimated_cost
        - latency_ms
      properties:
        receipt_id:
          type: string
        packet_sha256:
          type: string
        provider:
          type: string
          enum: [none, fake]
        model:
          type: string
        prompt_version:
          type: string
        schema_version:
          type: string
        cache_key:
          type: string
        status:
          type: string
          enum:
            - not_called
            - succeeded
            - cache_hit
            - privacy_blocked
            - budget_blocked
            - grounding_failed
            - schema_failed
            - provider_failed
        provider_calls:
          type: integer
          minimum: 0
        network_calls:
          type: integer
          enum: [0]
        synthetic:
          type: boolean
          default: false
        input_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        estimated_cost:
          type: number
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0
        error_code:
          type: string
          nullable: true
        consent_receipt_id:
          type: string
          nullable: true
        client_action_id:
          type: string
          nullable: true
        consent_status:
          type: string
          enum: [not_required, consumed]
          default: not_required
        budget:
          allOf:
            - $ref: "#/components/schemas/AnalysisBudgetV1"
          nullable: true
        cost_basis:
          type: string
          enum: [synthetic_zero_external_cost]
          nullable: true
        fallback:
          type: boolean
          default: false
      additionalProperties: false

    InventoryAnalysisResponse:
      type: object
      additionalProperties: false
      required: [analysis, receipt]
      properties:
        analysis:
          $ref: "#/components/schemas/AIAnalysisV1"
        receipt:
          $ref: "#/components/schemas/ModelCallReceiptV1"
        consent_receipt:
          allOf:
            - $ref: "#/components/schemas/AnalysisConsentReceiptV1"
          nullable: true

    InventoryReportCreateRequest:
      type: object
      additionalProperties: false
      required: [snapshot_id, packet_id, analysis_id]
      properties:
        snapshot_id:
          type: string
        packet_id:
          type: string
        analysis_id:
          type: string

    ReportManifestV1:
      type: object
      required:
        - schema_version
        - report_schema_version
        - report_id
        - artifact_id
        - snapshot_id
        - packet_id
        - analysis_id
        - generated_at
        - artifact_privacy_mode
        - provider
        - analysis_status
        - filename
        - workbook_sha256
        - sheets
        - zip_integrity
        - reopen_validated
      properties:
        schema_version:
          type: string
          enum: ["1.0"]
        report_schema_version:
          type: string
          enum: ["1.0"]
        report_id:
          type: string
        artifact_id:
          type: string
        snapshot_id:
          type: string
        packet_id:
          type: string
        analysis_id:
          type: string
        generated_at:
          type: string
          format: date-time
        artifact_privacy_mode:
          type: string
          enum: [local_full, share_safe]
        provider:
          type: string
          enum: [none, fake]
        analysis_status:
          type: string
          enum: [deterministic_only, ai_complete, ai_failed_fallback]
        filename:
          type: string
        workbook_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        sheets:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
        zip_integrity:
          type: boolean
          enum: [true]
        reopen_validated:
          type: boolean
          enum: [true]
      additionalProperties: false

    InventoryReportResponse:
      type: object
      additionalProperties: false
      required: [report_id, status, manifest, download_url]
      properties:
        report_id:
          type: string
        status:
          type: string
          enum: [deterministic_only, ai_complete, ai_failed_fallback]
        manifest:
          $ref: "#/components/schemas/ReportManifestV1"
        download_url:
          type: string

    AssetCategory:
      type: string
      enum: [photo, video, archive, installer, document, pdf, audio, other]

    SourceHint:
      type: string
      enum: [wechat, suspected_wechat, downloads, desktop, documents, pictures, screenshots, manual_folder, unknown]

    AssetStatus:
      type: string
      enum: [active, quarantined, missing, ignored]

    ScanStatus:
      type: string
      enum: [pending, running, completed, cancelled, failed, partial]

    RiskLevel:
      type: string
      enum: [low, medium, high]

    SuggestionCategory:
      type: string
      enum: [safe_to_process, archive_suggested, needs_confirmation, sensitive_protected, likely_unique_original]

    ProposedAction:
      type: string
      enum: [keep, review, protect, quarantine, archive_suggested]
      description: Suggested action only. Permanent deletion is intentionally absent.

    OperationAction:
      type: string
      enum: [quarantine, mark_ignored]
      description: Executable P0 actions. Permanent deletion is intentionally absent.

    OperationStatus:
      type: string
      enum: [succeeded, partial, failed, undone, undo_partial]

    QuarantineStatus:
      type: string
      enum: [quarantined, restored, restore_failed, missing]
