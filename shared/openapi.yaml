openapi: 3.0.3
info:
  title: Local AI Data Butler MVP API
  version: 0.1.0
  description: >
    First-version local API contract for the Data Butler MVP. This contract
    covers read-only scanning, local asset indexing, exact duplicate groups,
    file-intelligence overview, explainable suggestions, operation preview,
    quarantine execution, receipts, undo, and mock provider analysis.
    It does not expose permanent delete, real cloud upload, WeChat chat
    database parsing, face recognition, payment, or desktop-shell APIs.
servers:
  - url: http://127.0.0.1:8765
    description: Local Core service
tags:
  - name: health
  - name: scan
  - name: assets
  - name: fileintel
  - name: dups
  - name: suggestions
  - name: operations
  - name: quarantine
  - name: providers
  - name: inventory

paths:
  /health:
    get:
      tags: [health]
      summary: Check local Core service health
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"

  /scan:
    post:
      tags: [scan]
      summary: Start a read-only scan for authorized local directories
      operationId: createScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "202":
          description: Scan session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSession"
        default:
          $ref: "#/components/responses/Error"

  /scan/{scan_session_id}:
    get:
      tags: [scan]
      summary: Get scan session state
      operationId: getScanSession
      parameters:
        - $ref: "#/components/parameters/ScanSessionId"
      responses:
        "200":
          description: Scan session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSession"
        default:
          $ref: "#/components/responses/Error"

  /scan/{scan_session_id}/stream:
    get:
      tags: [scan]
      summary: Stream scan progress events
      description: >
        Server-Sent Events endpoint. Each event uses the SSE format
        `event: scan_event` and `data: {json}`. The JSON payload MUST match
        the ScanEvent schema. This endpoint is read-only and MUST NOT change
        files.
      operationId: streamScanEvents
      parameters:
        - $ref: "#/components/parameters/ScanSessionId"
      responses:
        "200":
          description: SSE stream of ScanEvent payloads
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                progress:
                  summary: Scan progress event
                  value: |
                    event: scan_event
                    data: {"event_id":"evt_001","scan_session_id":"scan_001","type":"progress","occurred_at":"2026-06-17T10:00:00Z","current_path":"C:\\Users\\me\\Downloads","files_seen":120,"files_indexed":118,"files_skipped":2}
        default:
          $ref: "#/components/responses/Error"

  /scan/{scan_session_id}/cancel:
    post:
      tags: [scan]
      summary: Cancel a running scan
      operationId: cancelScan
      parameters:
        - $ref: "#/components/parameters/ScanSessionId"
      responses:
        "200":
          description: Updated scan session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSession"
        default:
          $ref: "#/components/responses/Error"

  /assets:
    get:
      tags: [assets]
      summary: List indexed assets
      operationId: listAssets
      parameters:
        - $ref: "#/components/parameters/ScanSessionIdQuery"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/AssetCategory"
        - name: source_hint
          in: query
          schema:
            $ref: "#/components/schemas/SourceHint"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AssetStatus"
        - name: min_size_bytes
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        default:
          $ref: "#/components/responses/Error"

  /assets/{asset_id}:
    get:
      tags: [assets]
      summary: Get asset detail
      operationId: getAsset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset detail
          content:
            application/json:
              schema:
                type: object
                required: [asset, metadata]
                properties:
                  asset:
                    $ref: "#/components/schemas/Asset"
                  metadata:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssetMetadata"
        default:
          $ref: "#/components/responses/Error"

  /fileintel/overview:
    get:
      tags: [fileintel]
      summary: Get local file-intelligence overview
      operationId: getFileIntelOverview
      parameters:
        - $ref: "#/components/parameters/ScanSessionIdQuery"
      responses:
        "200":
          description: File intelligence overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileIntelOverview"
        default:
          $ref: "#/components/responses/Error"

  /dups:
    get:
      tags: [dups]
      summary: List exact duplicate groups
      operationId: listDuplicateGroups
      parameters:
        - $ref: "#/components/parameters/ScanSessionIdQuery"
        - name: min_reclaimable_bytes
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Duplicate groups
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DuplicateGroup"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        default:
          $ref: "#/components/responses/Error"

  /suggestions:
    get:
      tags: [suggestions]
      summary: List explainable suggestions
      operationId: listSuggestions
      parameters:
        - $ref: "#/components/parameters/ScanSessionIdQuery"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/SuggestionCategory"
        - name: risk_level
          in: query
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: default_selected
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Suggestion"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        default:
          $ref: "#/components/responses/Error"

  /operations/preview:
    post:
      tags: [operations]
      summary: Create an operation plan and preview
      description: >
        Frontend MUST request a preview before execution. The request uses
        asset_ids or suggestion_ids, never filesystem paths as executable
        authority.
      operationId: createOperationPreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationPreviewRequest"
      responses:
        "200":
          description: Operation plan preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationPlan"
        default:
          $ref: "#/components/responses/Error"

  /operations/execute:
    post:
      tags: [operations]
      summary: Execute a confirmed operation plan
      description: >
        Execution MUST be based on operation_plan_id and confirm=true.
        P0 only supports reversible operations such as quarantine or local
        metadata-only ignore. Permanent deletion is not part of this contract.
      operationId: executeOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationExecuteRequest"
      responses:
        "200":
          description: Operation receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationReceipt"
        default:
          $ref: "#/components/responses/Error"

  /operations:
    get:
      tags: [operations]
      summary: List operation receipts
      operationId: listOperations
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OperationStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Operation receipts
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationReceipt"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        default:
          $ref: "#/components/responses/Error"

  /operations/{operation_id}:
    get:
      tags: [operations]
      summary: Get operation receipt detail
      operationId: getOperation
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Operation receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationReceipt"
        default:
          $ref: "#/components/responses/Error"

  /operations/{operation_id}/undo:
    post:
      tags: [operations]
      summary: Undo a reversible operation
      operationId: undoOperation
      parameters:
        - $ref: "#/components/parameters/OperationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationUndoRequest"
      responses:
        "200":
          description: Updated operation receipt after undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationReceipt"
        default:
          $ref: "#/components/responses/Error"

  /quarantine:
    get:
      tags: [quarantine]
      summary: List quarantine items
      operationId: listQuarantineItems
      parameters:
        - name: operation_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/QuarantineStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Quarantine items
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuarantineItem"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        default:
          $ref: "#/components/responses/Error"

  /providers:
    get:
      tags: [providers]
      summary: List provider capabilities
      description: >
        P0 providers are local-only. Any mock provider listed here MUST NOT
        imply real upload or cloud processing capability.
      operationId: listProviders
      responses:
        "200":
          description: Provider capabilities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderInfo"
        default:
          $ref: "#/components/responses/Error"

  /providers/mock/analyze:
    post:
      tags: [providers]
      summary: Run local mock analysis
      description: >
        Stub endpoint for frontend integration tests. It accepts asset IDs or
        aggregate stats and returns mock analysis. It MUST NOT upload files,
        read remote services, or represent real cloud enhancement capability.
      operationId: runMockProviderAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockAnalyzeRequest"
      responses:
        "200":
          description: Mock provider analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockAnalyzeResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/scans:
    post:
      tags: [inventory]
      summary: Run the fixed metadata-only inventory fixture
      operationId: createInventoryScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryScanCreateRequest"
      responses:
        "201":
          description: Completed or partial fixture inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryScanResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/scans/{scan_id}:
    get:
      tags: [inventory]
      summary: Get fixture inventory status
      operationId: getInventoryScan
      parameters:
        - $ref: "#/components/parameters/InventoryScanId"
      responses:
        "200":
          description: Fixture inventory status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryScanResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/snapshots:
    post:
      tags: [inventory]
      summary: Materialize the persisted inventory snapshot
      operationId: createInventorySnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventorySnapshotCreateRequest"
      responses:
        "201":
          description: Canonical report snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSnapshotV1"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/snapshots/{snapshot_id}:
    get:
      tags: [inventory]
      summary: Get a persisted report snapshot
      operationId: getInventorySnapshot
      parameters:
        - $ref: "#/components/parameters/InventorySnapshotId"
      responses:
        "200":
          description: Canonical report snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSnapshotV1"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/analysis-packets/preview:
    post:
      tags: [inventory]
      summary: Preview and persist a local analysis packet
      operationId: previewInventoryAnalysisPacket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryPacketPreviewRequest"
      responses:
        "200":
          description: Analysis packet preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPacketPreviewResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/analyses:
    post:
      tags: [inventory]
      summary: Run none or fake analysis for a persisted packet
      operationId: createInventoryAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAnalysisCreateRequest"
      responses:
        "201":
          description: Analysis and zero-network model-call receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAnalysisResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/analyses/{analysis_id}:
    get:
      tags: [inventory]
      summary: Get a persisted analysis and receipt
      operationId: getInventoryAnalysis
      parameters:
        - $ref: "#/components/parameters/InventoryAnalysisId"
      responses:
        "200":
          description: Persisted analysis and receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAnalysisResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/reports:
    post:
      tags: [inventory]
      summary: Render and persist a verified five-sheet XLSX report
      operationId: createInventoryReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryReportCreateRequest"
      responses:
        "201":
          description: Verified report manifest and download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReportResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/reports/{report_id}:
    get:
      tags: [inventory]
      summary: Get a persisted report manifest
      operationId: getInventoryReport
      parameters:
        - $ref: "#/components/parameters/InventoryReportId"
      responses:
        "200":
          description: Persisted report manifest and download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReportResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/inventory/reports/{report_id}/download:
    get:
      tags: [inventory]
      summary: Download a verified XLSX report by report ID
      operationId: downloadInventoryReport
      parameters:
        - $ref: "#/components/parameters/InventoryReportId"
      responses:
        "200":
          description: Verified XLSX attachment
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    ScanSessionId:
      name: scan_session_id
      in: path
      required: true
      schema:
        type: string
    ScanSessionIdQuery:
      name: scan_session_id
      in: query
      required: false
      schema:
        type: string
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
    InventoryScanId:
      name: scan_id
      in: path
      required: true
      schema:
        type: string
    InventorySnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
    InventoryAnalysisId:
      name: analysis_id
      in: path
      required: true
      schema:
        type: string
    InventoryReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status, version, db_status, capabilities, current_time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        db_status:
          type: string
          enum: [ok, unavailable, migration_required]
        capabilities:
          type: object
          required:
            - real_upload_enabled
            - mock_provider_enabled
            - file_upload_enabled
            - cloud_metadata_analysis_available
            - cloud_metadata_analysis_enabled
            - controlled_synthetic_consent_available
          properties:
            real_upload_enabled:
              type: boolean
              enum: [false]
              description: P0 MUST always return false.
            mock_provider_enabled:
              type: boolean
            file_upload_enabled:
              type: boolean
              enum: [false]
            cloud_metadata_analysis_available:
              type: boolean
              enum: [false]
            cloud_metadata_analysis_enabled:
              type: boolean
              enum: [false]
            controlled_synthetic_consent_available:
              type: boolean
              enum: [true]
        current_time:
          type: string
          format: date-time

    ScanRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          items:
            type: string
          description: User-authorized local directories. Paths are only scan scope, not operation authority.
        options:
          type: object
          properties:
            include_hidden:
              type: boolean
              default: false
            follow_symlinks:
              type: boolean
              enum: [false]
              default: false
              description: P0 never follows symbolic links or junctions.
            compute_hash:
              type: boolean
              default: true
            source_hint_override:
              $ref: "#/components/schemas/SourceHint"

    ScanSession:
      type: object
      required:
        - id
        - status
        - requested_paths
        - started_at
        - files_seen
        - files_indexed
        - files_skipped
        - bytes_seen
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/ScanStatus"
        requested_paths:
          type: array
          items:
            type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        current_path:
          type: string
          nullable: true
        files_seen:
          type: integer
          format: int64
          minimum: 0
        files_indexed:
          type: integer
          format: int64
          minimum: 0
        files_skipped:
          type: integer
          format: int64
          minimum: 0
        bytes_seen:
          type: integer
          format: int64
          minimum: 0
        error_summary:
          type: array
          items:
            $ref: "#/components/schemas/ErrorSummaryItem"

    ScanEvent:
      type: object
      required: [event_id, scan_session_id, type, occurred_at]
      properties:
        event_id:
          type: string
        scan_session_id:
          type: string
        type:
          type: string
          enum: [started, progress, skipped, completed, cancelled, failed]
        occurred_at:
          type: string
          format: date-time
        current_path:
          type: string
          nullable: true
        files_seen:
          type: integer
          format: int64
          minimum: 0
        files_indexed:
          type: integer
          format: int64
          minimum: 0
        files_skipped:
          type: integer
          format: int64
          minimum: 0
        bytes_seen:
          type: integer
          format: int64
          minimum: 0
        message:
          type: string
          nullable: true
        error:
          $ref: "#/components/schemas/ErrorResponse"

    Asset:
      type: object
      required:
        - id
        - abs_path
        - size_bytes
        - ext
        - category
        - source_hint
        - status
        - scan_session_id
      properties:
        id:
          type: string
        abs_path:
          type: string
          description: Display-only source path. Frontend MUST NOT use this as action authority.
        path_hash:
          type: string
          nullable: true
        file_hash:
          type: string
          nullable: true
        partial_hash:
          type: string
          nullable: true
        hash_status:
          type: string
          enum: [not_started, partial, full, failed]
          default: not_started
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        ext:
          type: string
        mime:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/AssetCategory"
        source_hint:
          $ref: "#/components/schemas/SourceHint"
        created_at:
          type: string
          format: date-time
          nullable: true
        modified_at:
          type: string
          format: date-time
          nullable: true
        accessed_at:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: "#/components/schemas/AssetStatus"
        scan_session_id:
          type: string
        risk_flags:
          type: array
          items:
            type: string

    AssetMetadata:
      type: object
      required: [asset_id, key, value]
      properties:
        asset_id:
          type: string
        key:
          type: string
        value:
          type: string
        raw_json:
          type: object
          additionalProperties: true
          nullable: true

    FileIntelOverview:
      type: object
      required:
        - scan_session_id
        - total_files
        - total_size_bytes
        - by_category
        - by_source
        - top_large_files
        - risk_summary
        - generated_at
      properties:
        scan_session_id:
          type: string
        total_files:
          type: integer
          format: int64
          minimum: 0
        total_size_bytes:
          type: integer
          format: int64
          minimum: 0
        by_category:
          type: array
          items:
            $ref: "#/components/schemas/OverviewBucket"
        by_source:
          type: array
          items:
            $ref: "#/components/schemas/OverviewBucket"
        by_directory:
          type: array
          items:
            $ref: "#/components/schemas/OverviewBucket"
        top_large_files:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        risk_summary:
