<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<title id="title">空间透视：先看懂文件，再决定怎么整理</title>
<desc id="desc">暖白与森林绿的产品插画，展示旧安装包、课程资料和交接资料对应的清理、归档与保留建议。文件均为虚构样例。</desc>
<defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#23392d}
.eyebrow{font-family:ui-monospace,"SFMono-Regular",monospace;font-size:17px;letter-spacing:3px;fill:#58715f}
.title{font-size:62px;font-weight:650;letter-spacing:-2px}
.body{font-size:23px;fill:#607466}
.card-title{font-size:25px;font-weight:600}
.card-body{font-size:18px;fill:#607466}
</style></defs>
<rect x="1" y="1" width="1278" height="498" rx="24" fill="#f5f6ef" stroke="#dfe5d9"/>
<path d="M663 1v498" stroke="#dfe5d9"/>
<text class="eyebrow" x="58" y="65">SPACE PERSPECTIVE</text>
<text class="title" x="54" y="156">文件很多，</text>
<text class="title" x="54" y="233">决定可以清楚。</text>
<text class="body" x="58" y="292">从类型和用途线索，</text>
<text class="body" x="58" y="329">到有依据的整理建议。</text>
<rect x="58" y="386" width="130" height="44" rx="22" fill="#346c51"/>
