[project]
name = "local-data-butler"
version = "0.1.0"
description = "Local-first data governance MVP core service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0",
  "openpyxl==3.1.5",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "jsonschema==4.25.1",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["core/tests", "tests"]
